<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%237CFF00'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/dot/topic.css">
</head>
<body>
  <main class="page">
    <div class="top"><a class="back" href="/dot/" aria-label="Home">●</a></div>
    <div id="map" class="map"></div>
    <div class="topicHead">
      <span class="topicDot" aria-hidden="true"></span>
      <input disabled id="topicTitle" class="topicTitle" aria-label="Topic name">
    </div>
    <button disabled id="deleteTopic" class="deleteTopic" type="button">Delete</button>
    <p id="status" role="status"></p>
    <div id="posts" class="posts"></div>
    <form id="composer" class="composer">
      <span id="composerAvatar" class="lineAvatar" aria-hidden="true"></span>
      <textarea disabled aria-label="Anonymous line" id="postInput" rows="1" placeholder="Write an anonymous line" autocomplete="off" spellcheck="false"></textarea>
    </form>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script type="module" src="/dot/topic.js"></script>
</body>
</html>
