<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Dot</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%237CFF00'/%3E%3C/svg%3E"
  >

  <link
    rel="stylesheet"
    href="./topic.css"
  >
</head>

<body>

  <main class="page">

    <div class="top">
      <a
        class="back"
        href="./"
        aria-label="Back"
      >●</a>
    </div>

    <div
      id="map"
      class="map"
    ></div>

    <h1
      id="topicTitle"
      class="topicTitle"
    ></h1>

    <div
      id="posts"
      class="posts"
    ></div>

    <div class="composer">
      <input
        id="postInput"
        type="text"
        placeholder="Write a line"
        autocomplete="off"
        spellcheck="false"
      >
    </div>

  </main>

  <script src="./topic.js" defer></script>

</body>
</html>
